name: Build UI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          cache: false
          channel: "stable"

      - name: Build for Windows
        run: |
          cd lightningui
          flutter pub get
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Package into installer
        run: |
          Copy-Item -Force -Recurse -Verbose .\installer\* -Destination .\lightningui\build\windows\runner\Release
          makensis -V2 lightningui/build/windows/runner/Release/installer.nsi

      - name: Create folder structure
        run: |
          mkdir -Path ${{ github.workspace }}/executables
          mkdir -Path ${{ github.workspace }}/executables/windows
          mkdir -Path ${{ github.workspace }}/executables/windows/386
          mkdir -Path ${{ github.workspace }}/executables/windows/amd64

          cp -Path ${{ github.workspace }}/lightningui/build/windows/runner/Release/ui.exe -Destination ${{ github.workspace }}/executables/windows/386
          cp -Path ${{ github.workspace }}/lightningui/build/windows/runner/Release/ui.exe -Destination ${{ github.workspace }}/executables/windows/amd64

      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          path: ${{ github.workspace }}/executables

  build-linux:
    runs-on: ubuntu-20.04
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          cache: false
          channel: "stable"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev
          sudo apt-get install -y appindicator3-0.1 libappindicator3-dev

          dart pub global activate https://github.com/jeffrey0606/flutter_to_debian.git --source git

      - name: Build for Linux
        run: |
          export PATH="$PATH":"$PUB_CACHE/.pub-cache/bin"
          cd lightningui
          flutter pub get
          flutter config --enable-linux-desktop
          flutter build linux --release --target-platform=linux-x64

          flutter_to_debian

          mv ${{ github.workspace }}/lightningui/debian/packages/*.deb ${{ github.workspace }}/lightningui/debian/packages/ui.deb

      - name: Create folder structure
        run: |
          mkdir -p ${{ github.workspace }}/executables/linux/amd64

          cp -a ${{ github.workspace }}/lightningui/debian/packages/. ${{ github.workspace }}/executables/linux/amd64

      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          path: ${{ github.workspace }}/executables

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: 18

      - uses: subosito/flutter-action@v2
        with:
          cache: false
          channel: "stable"

      - name: Build for macOS
        run: |
          cd lightningui
          flutter pub get
          flutter config --enable-macos-desktop

          flutter create .
          find . -name "Podfile" -execdir pod install \;

          flutter build macos --release

      - name: Create folder structure
        run: |
          mkdir -p ${{ github.workspace }}/executables/macos
      
      - name: Create ICNS
        run: |
          cd ${{ github.workspace }}/installer
          
          mkdir icons.iconset
          sips -z 16 16     LightningBot.png --out icons.iconset/icon_16x16.png
          sips -z 32 32     LightningBot.png --out icons.iconset/icon_16x16@2x.png
          sips -z 32 32     LightningBot.png --out icons.iconset/icon_32x32.png
          sips -z 64 64     LightningBot.png --out icons.iconset/icon_32x32@2x.png
          sips -z 128 128   LightningBot.png --out icons.iconset/icon_128x128.png
          sips -z 256 256   LightningBot.png --out icons.iconset/icon_128x128@2x.png
          sips -z 256 256   LightningBot.png --out icons.iconset/icon_256x256.png
          sips -z 512 512   LightningBot.png --out icons.iconset/icon_256x256@2x.png
          sips -z 512 512   LightningBot.png --out icons.iconset/icon_512x512.png
          sips -z 1024 1024 LightningBot.png --out icons.iconset/icon_512x512@2x.png

          iconutil -c icns icons.iconset
          
          rm -R icons.iconset

      - name: Create DMG
        run: |
          npm install -g appdmg

          npx appdmg ${{ github.workspace }}/installer/dmg/config.json  ${{ github.workspace }}/executables/macos/ui.dmg

      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          path: ${{ github.workspace }}/executables
