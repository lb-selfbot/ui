name: Build UI

on:
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: 'master'

      - name: Build for Windows
        run: |
          cd lightningui
          flutter pub get
          flutter config --enable-windows-desktop
          flutter build windows --release
      
      - name: Package into installer
        run: |
          Copy-Item -Force -Recurse -Verbose .\installer\* -Destination .\lightningui\build\windows\runner\Release
          makensis -V2 lightningui/build/windows/runner/Release/installer.nsi
      
      - name: Create folder structure
        run: |
          mkdir -Path ${{ github.workspace }}/executables
          mkdir -Path ${{ github.workspace }}/executables/windows
          mkdir -Path ${{ github.workspace }}/executables/windows/386
          mkdir -Path ${{ github.workspace }}/executables/windows/amd64

          cp -Path ${{ github.workspace }}/lightningui/build/windows/runner/Release/ui.exe -Destination ${{ github.workspace }}/executables/windows/386
          cp -Path ${{ github.workspace }}/lightningui/build/windows/runner/Release/ui.exe -Destination ${{ github.workspace }}/executables/windows/amd64
 
      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          path: ${{ github.workspace }}/executables

  build-linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: 'master'
      
      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

      - name: Build for Linux
        run: |
          cd lightningui
          flutter pub get
          flutter config --enable-linux-desktop
          flutter build linux --release
      
      - name: Create folder structure
        run: |
          mkdir ${{ github.workspace }}/executables
          mkdir ${{ github.workspace }}/executables/linux
          mkdir ${{ github.workspace }}/executables/linux/386
          mkdir ${{ github.workspace }}/executables/linux/amd64
          mkdir ${{ github.workspace }}/executables/linux/arm
          mkdir ${{ github.workspace }}/executables/linux/arm64

          cp -a ${{ github.workspace }}/lightningui/build/linux/x64/release/bundle/. ${{ github.workspace }}/executables/linux/amd64
 
      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          path: ${{ github.workspace }}/executables
