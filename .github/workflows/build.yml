name: Build UI

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: "master"

      - name: Build for Windows
        run: |
          cd lightningui
          flutter pub get
          flutter config --enable-windows-desktop
          flutter build windows --release

      - name: Package into installer
        run: |
          Copy-Item -Force -Recurse -Verbose .\installer\* -Destination .\lightningui\build\windows\runner\Release
          makensis -V2 lightningui/build/windows/runner/Release/installer.nsi

      - name: Create folder structure
        run: |
          mkdir -Path ${{ github.workspace }}/executables
          mkdir -Path ${{ github.workspace }}/executables/windows
          mkdir -Path ${{ github.workspace }}/executables/windows/386
          mkdir -Path ${{ github.workspace }}/executables/windows/amd64

          cp -Path ${{ github.workspace }}/lightningui/build/windows/runner/Release/ui.exe -Destination ${{ github.workspace }}/executables/windows/386
          cp -Path ${{ github.workspace }}/lightningui/build/windows/runner/Release/ui.exe -Destination ${{ github.workspace }}/executables/windows/amd64

      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          path: ${{ github.workspace }}/executables

  build-linux:
    runs-on: ubuntu-18.04
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          cache: true
          channel: "master"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ninja-build libgtk-3-dev

          dart pub global activate https://github.com/jeffrey0606/flutter_to_debian.git --source git

      - name: Build for Linux
        run: |
          cd lightningui
          flutter pub get
          flutter config --enable-linux-desktop
          flutter build linux --release --target-platform=linux-x64

          sudo flutter_to_debian

      - name: Create folder structure
        run: |
          mkdir -p ${{ github.workspace }}/executables/linux/amd64

          cp -a ${{ github.workspace }}/lightningui/debian/packages/. ${{ github.workspace }}/executables/linux/amd64

      - name: Upload builds
        uses: actions/upload-artifact@v3.1.0
        with:
          path: ${{ github.workspace }}/executables
